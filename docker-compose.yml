services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowsuite
      POSTGRES_PASSWORD: flowsuite_dev
      POSTGRES_DB: flowsuite
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowsuite -d flowsuite"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      APP_URL: http://localhost:5173
      DATABASE_URL: postgresql://flowsuite:flowsuite_dev@db:5432/flowsuite?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-replace-before-deploy-2026}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL:-}
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma db push --schema apps/api/prisma/schema.prisma && npm run db:seed --workspace @flowsuite/api && npm run start --workspace @flowsuite/api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_PROXY: http://api:4000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
